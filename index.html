<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя веб-страница</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #1a1f24;         /* тёмный грозовой фон */
      color: #8fe08f;              /* светло-зелёный текст (виден на тёмном) */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;        /* не мешает кликам */
      z-index: -1;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
      position: relative;
    }
    h1 {
      color: #8fe08f;
      font-size: 3rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(143,224,143,.5);
    }
    .rentry {
      display: inline-block;
      color: #8fe08f;
      font-size: 1.4rem;
      margin: 20px 0;
      border-bottom: 2px solid #8fe08f;
      text-decoration: none;
      padding-bottom: 2px;
    }
    .rentry:hover {
      background: #8fe08f;
      color: #1a1f24;
    }
    p {
      color: #8fe08f;
      font-size: 1.3rem;
      margin: 12px 0;
      cursor: pointer;
    }
    /* Анимация подпрыгивания текста */
    .bounce {
      animation: bounceAnim 0.7s ease;
    }
    @keyframes bounceAnim {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(-18px); }
      55%  { transform: translateY(0); }
      75%  { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    /* === Роблокс-персонаж справа снизу === */
    #buddy {
      position: fixed;
      right: 28px;
      bottom: 20px;
      z-index: 20;
      width: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    #speech-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-bottom: 4px;
      animation: bob 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(40, 200, 60, 0.7));
    }
    #speech-btn:hover { transform: scale(1.08); }
    #speech-btn svg { display: block; width: 52px; height: 62px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .buddy-body {
      width: 110px;
      height: 150px;
      position: relative;
    }
    .buddy-head {
      width: 48px;
      height: 48px;
      background: #e8b48a;
      border-radius: 10px;
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.12);
    }
    .buddy-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      pointer-events: none;
    }
    .buddy-eyes {
      display: flex;
      gap: 10px;
    }
    .buddy-eye {
      width: 7px;
      height: 10px;
      background: #222;
      border-radius: 50%;
    }
    .buddy-smile {
      width: 18px;
      height: 9px;
      border-bottom: 3px solid #222;
      border-radius: 0 0 50% 50%;
      margin-top: 2px;
    }
    .buddy-torso {
      width: 56px;
      height: 58px;
      background: #1a1a1a;
      border-radius: 6px;
      position: absolute;
      left: 50%;
      top: 46px;
      transform: translateX(-50%);
      box-shadow: inset -5px -5px 0 rgba(255,255,255,0.06);
    }
    .buddy-arm-l, .buddy-arm-r {
      width: 22px;
      height: 52px;
      background: #111;
      border-radius: 5px;
      position: absolute;
      top: 48px;
      box-shadow: inset -3px -3px 0 rgba(255,255,255,0.05);
    }
    .buddy-arm-l { left: 4px; }
    .buddy-arm-r { right: 4px; }
    .buddy-leg-l, .buddy-leg-r {
      width: 24px;
      height: 42px;
      background: #0d0d0d;
      border-radius: 5px;
      position: absolute;
      top: 102px;
      box-shadow: inset -3px -3px 0 rgba(255,255,255,0.05);
    }
    .buddy-leg-l { left: 28px; }
    .buddy-leg-r { right: 28px; }

    /* === Мини-чат === */
    #mini-chat {
      display: none;
      position: fixed;
      right: 28px;
      bottom: 190px;
      width: 280px;
      max-width: calc(100vw - 40px);
      background: rgba(18, 22, 28, 0.96);
      border: 2px solid #8fe08f;
      border-radius: 14px;
      padding: 14px;
      z-index: 30;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(143,224,143,0.2);
      text-align: left;
      color: #cfe8cf;
      font-size: 0.95rem;
    }
    #mini-chat.open { display: block; animation: chatIn 0.25s ease; }
    @keyframes chatIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #mini-chat h3 {
      margin: 0 0 10px;
      color: #8fe08f;
      font-size: 1.05rem;
    }
    #chat-log {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-msg {
      padding: 8px 10px;
      border-radius: 10px;
      line-height: 1.35;
    }
    .chat-msg.bot {
      background: rgba(143,224,143,0.12);
      border: 1px solid rgba(143,224,143,0.35);
    }
    .chat-msg.user {
      background: rgba(255,255,255,0.08);
      align-self: flex-end;
    }
    #chat-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    #chat-options button {
      cursor: pointer;
      border: 1px solid #8fe08f;
      background: transparent;
      color: #8fe08f;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    #chat-options button:hover {
      background: #8fe08f;
      color: #1a1f24;
    }
    #chat-close {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      color: #8fe08f;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <audio id="yay-sound" src="yay-roblox.mp3" preload="auto"></audio>
  <main>
    <h1 id="title">Noelle's webpage</h1>
    <a class="rentry" href="#">my rentry</a>
    <p>lets chat!</p>
    <p>how are you feeling</p>
  </main>

  <!-- Роблокс-персонаж справа снизу + зелёный пузырь ! -->
  <div id="buddy">
    <button id="speech-btn" type="button" title="clickable" aria-label="Открыть чат">
      <svg viewBox="0 0 64 76" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 8 h48 a8 8 0 0 1 8 8 v28 a8 8 0 0 1 -8 8 H36 l-8 16 -4 -16 H8 a8 8 0 0 1 -8 -8 V16 a8 8 0 0 1 8 -8 z"
              fill="#1a6b2a" stroke="#3dff5a" stroke-width="4"/>
        <text x="32" y="38" text-anchor="middle" fill="#fff" font-size="28" font-weight="bold" font-family="Segoe UI,sans-serif">!</text>
      </svg>
    </button>
    <div class="buddy-body" aria-hidden="true">
      <div class="buddy-arm-l"></div>
      <div class="buddy-arm-r"></div>
      <div class="buddy-torso"></div>
      <div class="buddy-leg-l"></div>
      <div class="buddy-leg-r"></div>
      <div class="buddy-head">
        <div class="buddy-face">
          <div class="buddy-eyes">
            <span class="buddy-eye"></span>
            <span class="buddy-eye"></span>
          </div>
          <div class="buddy-smile"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Мини-чат -->
  <div id="mini-chat" role="dialog" aria-label="Мини чат">
    <button id="chat-close" type="button" aria-label="Закрыть">×</button>
    <h3>lets chat!</h3>
    <div id="chat-log"></div>
    <div id="chat-options"></div>
  </div>

  <script>
    // === Грозовые облака с молниями на весь экран ===
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      initClouds();
    }

    // Облака
    let clouds = [];
    function initClouds() {
      clouds = [];
      const n = 7;
      for (let i = 0; i < n; i++) {
        clouds.push({
          x: (i / n) * w + Math.random() * 60 - 30,
          y: 30 + Math.random() * 140,
          scale: 0.8 + Math.random() * 0.9,
          speed: 0.15 + Math.random() * 0.3,
          puffs: 5 + Math.floor(Math.random() * 4)
        });
      }
    }

    function drawCloud(c, time) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.scale, c.scale);
      ctx.fillStyle = 'rgba(45,52,60,0.9)';
      for (let i = 0; i < c.puffs; i++) {
        const a = (i / c.puffs) * Math.PI * 2;
        const px = Math.cos(a) * 70 * (0.8 + 0.2 * Math.sin(time + i));
        const py = Math.sin(a) * 38 + Math.sin(time * 0.7 + i) * 6;
        ctx.beginPath();
        ctx.arc(px, py, 70 + 20 * Math.sin(time * 0.5 + i), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Вспышка молнии
    let flash = 0;
    let nextStrike = 2;
    let bolts = [];

    function makeBolt() {
      const bx = Math.random() * w;
      const by = 0;
      const pts = [];
      let x = bx, y = by;
      let segs = 6 + Math.floor(Math.random() * 5);
      for (let s = 0; s < segs; s++) {
        pts.push({ x, y });
        x += (Math.random() - 0.5) * 60;
        y += 40 + Math.random() * 50;
      }
      pts.push({ x, y });
      bolts.push({ pts, life: 0.35, max: 0.35 });
      flash = Math.min(flash + 0.6, 0.7);
    }

    function frame() {
      ctx.clearRect(0, 0, w, h);
      // небо
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#2b3440');
      grad.addColorStop(0.5, '#202631');
      grad.addColorStop(1, '#1a1f24');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // облака дрейфуют вправо
      for (const c of clouds) {
        c.x += c.speed;
        if (c.x > w + 160) c.x = -160;
        drawCloud(c, performance.now() / 1000);
      }

      // тайм молний
      nextStrike -= 0.016;
      if (nextStrike <= 0) {
        makeBolt();
        nextStrike = 1.5 + Math.random() * 4;
      }

      // рисуем молнии
      bolts.forEach(b => {
        b.life -= 0.016;
        ctx.strokeStyle = 'rgba(230,240,255,' + (b.life / b.max) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.pts[0].x, b.pts[0].y);
        for (let i = 1; i < b.pts.length; i++) {
          const t = Math.sin(i * 12 + performance.now() / 40) * 6;
          ctx.lineTo(b.pts[i].x + t, b.pts[i].y);
        }
        ctx.stroke();
      });
      bolts = bolts.filter(b => b.life > 0);

      // вспышка, затухающая
      if (flash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + flash * 0.25 + ')';
        ctx.fillRect(0, 0, w, h);
        flash *= 0.92;
        if (flash < 0.01) flash = 0;
      }

      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    frame();

    // === Подпрыгивание текста каждые 10 секунд со звуком ===
    const title = document.getElementById('title');
    const yaySound = document.getElementById('yay-sound');

    function playYay() {
      // Анимация подпрыгивания
      title.classList.remove('bounce');
      void title.offsetWidth; // перезапуск CSS-анимации
      title.classList.add('bounce');
      // Звук
      yaySound.currentTime = 0;
      yaySound.play().catch(() => {}); // если заблокирован — молча пропускаем
    }

    // === Разблокировка звука при первом взаимодействии пользователя ===
    // Браузеры блокируют автозвук, пока пользователь не кликнет/не нажмёт клавишу.
    // Размораживаем аудио при первом клике — после этого звук стабильно работает.
    function unlockAudio() {
      yaySound.volume = 1.0;
      yaySound.play().then(() => {
        yaySound.pause();
        yaySound.currentTime = 0;
      }).catch(() => {});
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
      document.removeEventListener('touchstart', unlockAudio);
    }
    document.addEventListener('click', unlockAudio);
    document.addEventListener('keydown', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    setInterval(playYay, 10000); // каждые 10 секунд

    // === Мини-чат у персонажа (диалог Brandon'а) ===
    const speechBtn = document.getElementById('speech-btn');
    const miniChat = document.getElementById('mini-chat');
    const chatClose = document.getElementById('chat-close');
    const chatLog = document.getElementById('chat-log');
    const chatOptions = document.getElementById('chat-options');

    // Карта диалога Brandon6875935: { вопрос/ответ: { bot, next: опции } }
    const DIALOGUE = {
      start: {
        bot: "let's chat! how are you feeling",
        next: ["feeling bad", "feeling good"]
      },
      'feeling bad': {
        bot: "sorry :( whats going on?",
        next: ["something online", "something irl"]
      },
      'something online': {
        bot: "noobs/trolls bothering you? try ignoring :D it'll be okay",
        next: null
      },
      'something irl': {
        bot: "hope it works out, wish i could help sooner.. try talking it out with the person",
        next: null
      },
      'feeling good': {
        bot: "cool :D what have you been up to",
        next: ["playing games", "чтонибудь другое"]
      },
      'playing games': {
        bot: "oh what game is your favorite right now?",
        next: ["heli wars", "что-то другое"]
      },
      'heli wars': {
        bot: "ozo is that you? LOL it must be! Hope you still get out there and pwn, so much fun",
        next: null
      },
      'чтонибудь другое': {
        bot: "nice! :)",
        next: null
      },
      'что-то другое': {
        bot: "ok :)",
        next: null
      }
    };

    function addMsg(text, who) {
      const d = document.createElement('div');
      d.className = 'chat-msg ' + who;
      d.textContent = text;
      chatLog.appendChild(d);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function renderOptions(options) {
      chatOptions.innerHTML = '';
      if (!options) return;
      options.forEach(label => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.addEventListener('click', () => handleAnswer(label));
        chatOptions.appendChild(b);
      });
    }

    function handleAnswer(label) {
      addMsg(label, 'user');
      let botAnswer = '';
      let nextOptions = null;
      const direct = DIALOGUE[label];
      if (direct) {
        botAnswer = direct.bot;
        nextOptions = direct.next;
      } else {
        botAnswer = "interesting :)";
        nextOptions = null;
      }
      setTimeout(() => {
        addMsg(botAnswer, 'bot');
        renderOptions(nextOptions);
      }, 600);
    }

    function openChat() {
      miniChat.classList.add('open');
      if (!chatLog.children.length) {
        const start = DIALOGUE.start;
        addMsg(start.bot, 'bot');
        renderOptions(start.next);
      }
    }

    function closeChat() {
      miniChat.classList.remove('open');
    }

    speechBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (miniChat.classList.contains('open')) closeChat();
      else openChat();
    });
    chatClose.addEventListener('click', closeChat);
  </script>
</body>
</html>

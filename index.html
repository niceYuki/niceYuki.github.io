<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя веб-страница</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff;      /* белый фон */
      color: #0a3d0a;           /* тёмно-зелёный текст */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;     /* не мешает кликам */
      z-index: -1;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
      position: relative;
    }
    h1 {
      color: #0a3d0a;
      font-size: 3rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .rentry {
      display: inline-block;
      color: #0a3d0a;
      font-size: 1.4rem;
      margin: 20px 0;
      border-bottom: 2px solid #0a3d0a;
      text-decoration: none;
      padding-bottom: 2px;
    }
    .rentry:hover {
      background: #0a3d0a;
      color: #fff;
    }
    p {
      color: #0a3d0a;
      font-size: 1.3rem;
      margin: 12px 0;
      cursor: pointer;
    }
    /* Анимация подпрыгивания текста */
    .bounce {
      animation: bounceAnim 0.7s ease;
    }
    @keyframes bounceAnim {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(-18px); }
      55%  { transform: translateY(0); }
      75%  { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <audio id="yay-sound" src="yay-roblox.mp3" preload="auto"></audio>
  <main>
    <h1 id="title">Noelle's webpage</h1>
    <a class="rentry" href="#">my rentry</a>
    <p>lets chat!</p>
    <p>how are you feeling</p>
  </main>

  <script>
    // Зелёные виляющие линии в углах экрана
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // === Подпрыгивание текста каждые 10 секунд со звуком ===
    const title = document.getElementById('title');
    const yaySound = document.getElementById('yay-sound');

    function playYay() {
      // Анимация подпрыгивания
      title.classList.remove('bounce');
      void title.offsetWidth; // перезапуск CSS-анимации
      title.classList.add('bounce');
      // Звук
      yaySound.currentTime = 0;
      yaySound.play().catch(() => {}); // если заблокирован — молча пропускаем
    }

    // === Разблокировка звука при первом взаимодействии пользователя ===
    // Браузеры блокируют автозвук, пока пользователь не кликнет/не нажмёт клавишу.
    // Размораживаем аудио при первом клике — после этого звук стабильно работает.
    function unlockAudio() {
      yaySound.volume = 1.0;
      yaySound.play().then(() => {
        yaySound.pause();
        yaySound.currentTime = 0;
      }).catch(() => {});
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
      document.removeEventListener('touchstart', unlockAudio);
    }
    document.addEventListener('click', unlockAudio);
    document.addEventListener('keydown', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    setInterval(playYay, 10000); // каждые 10 секунд

    // Параметры линии, исходящей из угла
    function drawCornerLine(cx, cy, dirX, dirY, time, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      const seg = 26;
      const n = 34;
      const amp = 22;           // амплитуда "виляния"
      let x = cx, y = cy;
      ctx.moveTo(x, y);
      for (let i = 1; i <= n; i++) {
        const t = i / n;
        // основное направление
        const px = cx + dirX * t * 360;
        const py = cy + dirY * t * 360;
        // перпендикулярные колебания (из стороны в сторону)
        const wave = Math.sin(t * Math.PI * 3 + time + i) * amp * t;
        x = px + (-dirY) * wave;
        y = py + (dirX) * wave;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    let time = 0;
    function frame() {
      ctx.clearRect(0, 0, w, h);
      time += 0.04;
      const dark = '#0a3d0a';
      const med = '#1a6b2a';
      const light = '#2e8b3a';
      // Левая линия тянущаяся вниз сверху оправы
      drawCornerLine(0, 0, 1, 0.35, time * 1.0, dark);      // сверху слева → вправо
      drawCornerLine(0, h, 1, -0.35, time * 1.1, light);    // снизу слева → вправо
      drawCornerLine(w, 0, -1, 0.35, time * 1.2 + 0.5, dark); // сверху справа → влево
      drawCornerLine(w, h, -1, -0.35, time * 1.3, med);     // снизу справа → влево
      // Дополнительно линии вертикально от углов к центру
      drawCornerLine(0, 0, 0.35, 1, time * 0.9 + 0.8, med);     // сверху слева → вниз
      drawCornerLine(w, 0, -0.35, 1, time * 0.9 + 1.2, light);  // сверху справа → вниз
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>

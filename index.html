<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <style>
    /* Встроенные стили — побеждают любой кэшированный внешний CSS */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000000;   /* чёрный фон */
      color: #0a3d0a;        /* тёмно-зелёный текст */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }
    h1 { color: #0a3d0a; font-size: 2.5rem; }
    p  { color: #0a3d0a; font-size: 1.2rem; }

    /* Сама админ-панель (скрыта, открывается по Konami коду) */
    #admin-panel {
      display: none;
      margin-top: 40px;
      border: 2px solid #0a3d0a;
      border-radius: 12px;
      padding: 30px;
      background: #000;
    }
    #admin-panel h2 { color: #0a3d0a; margin-bottom: 15px; }
    #admin-panel p { color: #0a3d0a; }
    #admin-panel button {
      cursor: pointer;
      padding: 10px 18px;
      margin: 5px;
      background: #0a3d0a;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:#000000;color:#0a3d0a;">
  <main>
    <h1 style="color:#0a3d0a;">Привет</h1>
    <p style="color:#0a3d0a;">Пока ничего нет.</p>

    <!-- Админ-панель (открывается по Konami коду: ↑ ↑ ↓ ↓ ← → ← → B A) -->
    <div id="admin-panel">
      <h2>Админ-панель</h2>
      <p>Консоль администратора активна.</p>
      <p id="admin-output"></p>
      <button id="admin-say-hi">Написать "Привет админ"</button>
      <button id="admin-logout">Выход</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

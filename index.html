<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <style>
    /* Встроенные стили — побеждают любой кэшированный внешний CSS */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000000;   /* чёрный фон */
      color: #0a3d0a;        /* тёмно-зелёный текст */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }
    h1 { color: #0a3d0a; font-size: 2.5rem; }
    p  { color: #0a3d0a; font-size: 1.2rem; }

    /* Скрытое поле ввода кода */
    #code-box {
      display: none;
      margin-top: 30px;
    }
    #code-box input {
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 2px solid #0a3d0a;
      background: #000;
      color: #0a3d0a;
      border-radius: 8px;
      text-align: center;
    }
    #code-box input::placeholder { color: #1a5c2a; }

    /* Кнопка админ-панели — появляется только после верного кода */
    #admin-btn {
      display: none;
      margin-top: 25px;
      cursor: pointer;
      background: #0a3d0a;
      color: #000;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      border-radius: 30px;
      font-weight: 600;
    }

    /* Сама админ-панель */
    #admin-panel {
      display: none;
      margin-top: 40px;
      border: 2px solid #0a3d0a;
      border-radius: 12px;
      padding: 30px;
      background: #000;
    }
    #admin-panel h2 { color: #0a3d0a; margin-bottom: 15px; }
    #admin-panel p { color: #0a3d0a; }
    #admin-panel button {
      cursor: pointer;
      padding: 10px 18px;
      margin: 5px;
      background: #0a3d0a;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 600;
    }

    .error-msg {
      color: #7a0a0a;
      margin-top: 10px;
      display: none;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:#000000;color:#0a3d0a;">
  <main>
    <h1 style="color:#0a3d0a;">Привет</h1>
    <p style="color:#0a3d0a;">Пока ничего нет.</p>

    <!-- Поле ввода кода (скрыто, появляется по клику на этой зоне) -->
    <div id="code-box">
      <input id="code-input" type="password" placeholder="Введите код" autocomplete="off">
      <div class="error-msg" id="code-error">Неверный код</div>
    </div>

    <!-- Кнопка админ-панели (появляется только после верного кода) -->
    <button id="admin-btn">Открыть админ-панель</button>

    <!-- Админ-панель -->
    <div id="admin-panel">
      <h2>Админ-панель</h2>
      <p>Вы вошли как администратор.</p>
      <p id="admin-output"></p>
      <button id="admin-say-hi">Написать "Привет админ"</button>
      <button id="admin-logout">Выход</button>
    </div>

    <span style="color:#000;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;cursor:pointer;" id="trigger">.</span>
  </main>

  <script src="script.js"></script>
</body>
</html>

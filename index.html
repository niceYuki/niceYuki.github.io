<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <style>
    /* Встроенные стили — побеждают любой кэшированный внешний CSS */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000000;   /* чёрный фон */
      color: #0a3d0a;        /* тёмно-зелёный текст */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }
    h1 { color: #0a3d0a; font-size: 2.5rem; }
    p  { color: #0a3d0a; font-size: 1.2rem; }

    /* Клавиши-капки (как на клавиатуре): показывают комбинацию */
    #konami-keys {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 30px auto 10px;
    }
    .keycap {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      background: #2a2a2a;      /* тёмная клавиша */
      border: 2px solid #555;   /* окантовка клавиши */
      border-radius: 8px;
      box-shadow: 0 4px 0 #000, inset 0 1px 0 rgba(255,255,255,.15);
      transition: background 0.15s, transform 0.1s, box-shadow 0.1s;
      user-select: none;
    }
    /* Стрелки-капки */
    .keycap.arrow { font-size: 20px; color: #cfcfcf; }
    /* Подсвеченная клавиша (введённая часть кода) */
    .keycap.filled {
      background: #0a3d0a;
      border-color: #0a3d0a;
      color: #000;
      box-shadow: 0 4px 0 #052505, inset 0 1px 0 rgba(255,255,255,.2);
    }
    .keycap.filled.arrow { color: #000; }

    /* Сама админ-панель (скрыта, открывается по Konami коду) */
    #admin-panel {
      display: none;
      margin-top: 40px;
      border: 2px solid #0a3d0a;
      border-radius: 12px;
      padding: 30px;
      background: #000;
    }
    #admin-panel h2 { color: #0a3d0a; margin-bottom: 15px; }
    #admin-panel p { color: #0a3d0a; }
    #admin-panel button {
      cursor: pointer;
      padding: 10px 18px;
      margin: 5px;
      background: #0a3d0a;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:#000000;color:#0a3d0a;">
  <main>
    <h1 style="color:#0a3d0a;">Привет</h1>
    <p style="color:#0a3d0a;">Пока ничего нет.</p>

    <!-- Клавиши комбинации (капки как на клавиатуре) -->
    <div id="konami-keys">
      <span class="keycap arrow">↑</span>
      <span class="keycap arrow">↑</span>
      <span class="keycap arrow">↓</span>
      <span class="keycap arrow">↓</span>
      <span class="keycap arrow">←</span>
      <span class="keycap arrow">→</span>
      <span class="keycap arrow">←</span>
      <span class="keycap arrow">→</span>
      <span class="keycap">B</span>
      <span class="keycap">A</span>
    </div>

    <!-- Админ-панель (открывается по Konami коду: ↑ ↑ ↓ ↓ ← → ← → B A) -->
    <div id="admin-panel">
      <h2>Админ-панель</h2>
      <p>Консоль администратора активна.</p>
      <p id="admin-output"></p>
      <button id="admin-say-hi">Написать "Привет админ"</button>
      <button id="admin-logout">Выход</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
